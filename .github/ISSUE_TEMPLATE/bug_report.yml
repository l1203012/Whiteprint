name: Bug report
description: Something in Whiteprint doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please check the [open issues](https://github.com/l1203012/Whiteprint-Notetaking-Application/issues) first, in case it is already known.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: whiteprint-version
    attributes:
      label: Whiteprint version
      description: The name of the DMG or Setup.exe you installed (e.g. 0.1.0-beta.1, 0.1.1, or 0.1.0-beta.1-edge.42). On macOS also Whiteprint → About Whiteprint.
      placeholder: 0.1.1
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: On macOS, Apple menu → About This Mac. On Windows, Settings → System → About, or run `winver`.
      placeholder: macOS 14.6 Sonoma / Windows 11 23H2
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      description: On a Mac, About This Mac shows the chip (Apple M…) or processor (Intel).
      options:
        - Mac with Apple Silicon (M1, M2, M3, …)
        - Mac with Intel
        - Windows PC (64-bit)
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - DMG or Setup.exe from a GitHub release
        - winget
        - Edge build (workflow artifact)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do? Small example notes help a lot.
      placeholder: |
        1. Create a note with …
        2. Switch to …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Screenshots, error messages or a crash report are welcome.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: How often it happens, whether it started with a particular version, workarounds you found.
    validations:
      required: false
