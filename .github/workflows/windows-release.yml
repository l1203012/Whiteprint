# Builds the Windows installer and publishes it as a draft GitHub Release tagged windows-v<version>,
# separate from the macOS releases (v<version>, release.yml).
name: Windows Release

on:
  push:
    tags: ["windows-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0-beta.2 (default: the tag)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=$(sed -n 's/^project(Whiteprint VERSION \([0-9.]*\).*/\1/p' windows/CMakeLists.txt)
          fi
          version=${version#windows-}
          version=${version#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Whiteprint $version"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtpdf
          tools: tools_mingw1310
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        shell: pwsh
        run: |
          $mingw = (Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter "mingw*" | Select-Object -First 1).FullName
          $env:PATH = "$mingw\bin;$env:PATH"
          cmake -S windows -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DWP_VERSION=$env:VERSION" `
            -DCMAKE_C_COMPILER="$mingw\bin\gcc.exe" -DCMAKE_CXX_COMPILER="$mingw\bin\g++.exe"
          cmake --build build

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package installer
        shell: pwsh
        run: |
          $mingw = (Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter "mingw*" | Select-Object -First 1).FullName
          $env:PATH = "$mingw\bin;$env:PATH"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $iscc) { $env:PATH = "$iscc;$env:PATH" }
          powershell -ExecutionPolicy Bypass -File windows/installer/package.ps1 -Version $env:VERSION -BuildDir build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Whiteprint-${{ env.VERSION }}-Windows
          path: |
            .build/windows-release/Whiteprint-${{ env.VERSION }}-Setup.exe
            .build/windows-release/Whiteprint-${{ env.VERSION }}-Setup.exe.sha256

      - name: Draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="windows-v$VERSION"
          setup="Whiteprint-$VERSION-Setup.exe"
          files=(".build/windows-release/$setup" ".build/windows-release/$setup.sha256")
          sha=$(cut -d' ' -f1 < ".build/windows-release/$setup.sha256")
          # Install section from .github/windows-release-notes.md (the leading HTML comment is dropped).
          sed -e '/^<!--$/,/^-->$/d' \
              -e "s|{{VERSION}}|$VERSION|g" -e "s|{{SETUP}}|$setup|g" \
              -e "s|{{SHA256}}|$sha|g" -e "s|{{REPOSITORY}}|$REPOSITORY|g" \
              .github/windows-release-notes.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            prerelease=()
            case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
            # If the macOS workflow created the draft in the meantime, create fails: upload instead.
            gh release create "$tag" "${files[@]}" --draft --generate-notes --notes-file "$RUNNER_TEMP/notes.md" \
              --title "Whiteprint $VERSION (Windows)" --target "$GITHUB_SHA" "${prerelease[@]}" \
              || gh release upload "$tag" "${files[@]}" --clobber
          fi
