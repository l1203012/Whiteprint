# Builds the install DMGs (Apple Silicon and Intel) and attaches them to a draft GitHub Release.
# The Windows Release workflow adds the Windows installer to the same release for vX.Y.Z tags.
# Runs for pushed vMAJOR.MINOR.PATCH[-pre] tags, or by hand from the Actions tab.
# Signing and notarization happen only when their secrets are set; see
# docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0-beta.2 (default: the tag, or Info.plist)"
        required: false
        type: string
      tag:
        description: "Attach to this existing release instead of v<version>, e.g. windows-v0.1.1"
        required: false
        type: string
      plain_dmg:
        description: "Skip the Finder window layout of the DMG"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One run per tag at a time; a second run for the same tag waits, then
# replaces the first one's files instead of creating another release.
concurrency:
  group: release-${{ inputs.tag || (inputs.version && format('v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DMG_PLAIN: ${{ inputs.plain_dmg && '1' || vars.DMG_PLAIN || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # build.sh numbers builds by commit count.
          fetch-depth: 0

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
            if ! [[ $version =~ ^v ]]; then
              echo "::error::Release tags start with v, like v1.2.0 or v1.2.0-beta.1; got $version"
              exit 1
            fi
          else
            version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          fi
          version=${version#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::'$version' is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease, e.g. 1.2.0 or 1.2.0-beta.1"
            exit 1
          fi
          plist=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          if [ "$plist" != "$version" ]; then
            echo "::warning::Resources/Info.plist says $plist; the release is built as $version"
          fi
          {
            echo "VERSION=$version"
            echo "TAG=${INPUT_TAG:-v$version}"
            echo "DMG_ARM=Whiteprint-$version-AppleSilicon.dmg"
            echo "DMG_INTEL=Whiteprint-$version-Intel.dmg"
          } >> "$GITHUB_ENV"
          echo "Whiteprint $version"
          swift --version

      - name: Test
        run: Scripts/test.sh

      - name: Check signing secrets
        id: secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "sign=$([ -n "$MACOS_CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "notarize=$([ -n "$NOTARY_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: steps.secrets.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Our keychain first, then the existing ones (quoted paths, split on whitespace).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          # The .p8 file as is, or base64-encoded.
          if printf '%s' "$NOTARY_KEY" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$NOTARY_KEY" > "$key"
          else
            printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
          fi
          {
            echo "NOTARY_KEY_PATH=$key"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build DMGs
        run: |
          ARCHS=arm64 Scripts/release.sh "$VERSION"
          ARCHS=x86_64 Scripts/release.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: Whiteprint-${{ env.VERSION }}
          path: |
            .build/release/${{ env.DMG_ARM }}
            .build/release/${{ env.DMG_ARM }}.sha256
            .build/release/${{ env.DMG_INTEL }}
            .build/release/${{ env.DMG_INTEL }}.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZED: ${{ steps.secrets.outputs.sign == 'true' && steps.secrets.outputs.notarize == 'true' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body > "$RUNNER_TEMP/generated.md"
          python3 - "$RUNNER_TEMP/generated.md" .github/release-notes.md > "$RUNNER_TEMP/notes.md" <<'EOF'
          import os, re, sys
          generated, template = open(sys.argv[1]).read().strip(), open(sys.argv[2]).read()
          sha = lambda dmg: open(f".build/release/{dmg}.sha256").read().split()[0]
          template = re.sub(r"\A\s*<!--.*?-->\s*", "", template, flags=re.S)
          if os.environ["NOTARIZED"] == "true":
              template = re.sub(r"<!-- unsigned -->.*?<!-- /unsigned -->\n?", "", template, flags=re.S)
          else:
              template = re.sub(r"<!-- /?unsigned -->\n?", "", template)
          arm, intel = os.environ["DMG_ARM"], os.environ["DMG_INTEL"]
          values = {"VERSION": os.environ["VERSION"], "TAG": os.environ["TAG"], "DMG_ARM": arm,
                    "DMG_INTEL": intel, "SHA256_ARM": sha(arm), "SHA256_INTEL": sha(intel),
                    "SETUP": f"Whiteprint-{os.environ['VERSION']}-Setup.exe",
                    "REPOSITORY": os.environ["GITHUB_REPOSITORY"]}
          template = re.sub(r"\{\{(\w+)\}\}", lambda m: values[m.group(1)], template)
          print(generated + "\n\n" + template.strip())
          EOF
          cat "$RUNNER_TEMP/notes.md"

      # Creates a draft release, or, if one exists for the tag (a re-run, or a
      # second run for the same tag push), replaces its files. A draft also gets
      # fresh notes; a published release keeps the notes it was published with.
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(".build/release/$DMG_ARM" ".build/release/$DMG_ARM.sha256"
                 ".build/release/$DMG_INTEL" ".build/release/$DMG_INTEL.sha256")
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          notes="$RUNNER_TEMP/notes.md"

          update() {
            gh release upload "$TAG" "${files[@]}" --clobber
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$TAG" --notes-file "$notes" --prerelease="$prerelease"
              echo "Updated the files and notes of the draft release $TAG"
            else
              echo "::notice::$TAG is already published; replaced its files and kept its notes"
            fi
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            update
          elif ! gh release create "$TAG" "${files[@]}" --draft --title "Whiteprint $VERSION" \
              --notes-file "$notes" --target "$GITHUB_SHA" --prerelease="$prerelease"; then
            # Another run may have created it in the meantime.
            gh release view "$TAG" >/dev/null
            update
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          {
            echo "### Whiteprint $VERSION"
            echo
            echo "Release: $url (pre-release: $prerelease). If it is a draft, review the notes and publish it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain and key
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
