# Builds every module and the app, and runs the tests.
name: CI

on:
  push:
    branches: [main-macos]
  pull_request:
    branches: [main-macos]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Build
        run: Scripts/build.sh

      - name: Test
        run: Scripts/test.sh

      - name: Build app
        run: Scripts/build.sh app
